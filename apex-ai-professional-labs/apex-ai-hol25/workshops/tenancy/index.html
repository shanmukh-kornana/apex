<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Oracle LiveLabs gives you access to Oracle products through hands-on labs and workshops.">
    <title>Oracle LiveLabs</title>

    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/jquery-1.11.0.min.js"></script>
    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/jquery-ui-1.10.4.custom.js"></script>
    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/main.min.js"></script>

    <link rel="stylesheet" href="https://livelabs.oracle.com/cdn/common/redwood-hol/css/style.min.css" />
    <link rel="shortcut icon" href="https://livelabs.oracle.com/cdn/common/redwood-hol/img/favicon.ico" />
</head>

<body>
    <header class="hol-Header" role="banner">
        <div class="hol-Header-wrap">
            <div class="hol-Header-logo"><span>Oracle LiveLabs</span></div>
            <a href="https://livelabs.oracle.com" target="_blank" id="livelabs" title="Oracle LiveLabs"></a>
            <div class="hol-Header-actions">
                <button id="openNav" class="hol-Header-button hol-Header-button--menu rightNav" aria-label="Open Menu" title="Open Menu">
                    <span class="hol-Header-toggleIcon"></span>
                </button>
            </div>
        </div>
    </header>

    <div id="container">
        <div id="leftNav"><div id="toc"></div></div>
        <div id="contentBox"><main class="hol-Content" id="module-content"></main></div>
    </div>

    <footer class="hol-Footer">
        <a class="hol-Footer-topLink" href="#top">Return to Top</a>
        <div id="footer-banner"><div class="footer-row"><div class="footer-content"><ul class="footer-links">
            <li><a href="https://docs.oracle.com/pls/topic/lookup?ctx=en/legal&id=cpyr" target="_blank">© Oracle</a></li>
            <li><a href="https://www.oracle.com/corporate/index.html" target="_blank">About Oracle</a></li>
            <li><a href="https://www.oracle.com/corporate/contact/" target="_blank">Contact Us</a></li>
            <li><a href="https://www.oracle.com/legal/privacy/" target="_blank">Terms of Use &amp; Privacy</a></li>
        </ul></div></div></div>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const content = document.getElementById("module-content");
            function shortenLabCaptions() {
                if (!["1-enable-install-ess-pwa", "2-add-pwa-shortcuts-screenshots", "3-enable-push-notifications", "4-verify-mobile-review-apex-to-go"].includes(new URLSearchParams(location.search).get("lab"))) return;
                content.querySelectorAll("table caption").forEach(function (caption) {
                    const shortened = caption.textContent.replace(/ \| Lab (?:1: Enable and Install ESS as a PWA|2: Add PWA Shortcuts and Screenshots|3: Enable Push Notifications|4: Verify ESS on Mobile and Review APEX To Go)$/, "");
                    if (shortened !== caption.textContent) caption.textContent = shortened;
                });
            }
            new MutationObserver(shortenLabCaptions).observe(content, { childList: true, subtree: true });
            shortenLabCaptions();
        });
    </script>
</body>

</html>
